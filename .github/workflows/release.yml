name: Release

# Build packages and publish a GitHub Release when a version tag is pushed.
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    name: Build Linux package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev fakeroot

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: make package-deb VERSION=${{ steps.version.outputs.version }}

      - name: Build binary tarball
        run: |
          VERSION=${{ steps.version.outputs.version }}
          go build -ldflags "-s -w -X main.version=${VERSION}" -o markview ./cmd/markview
          tar czf "dist/markview_${VERSION}_linux_amd64.tar.gz" markview README.md LICENSE.md

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/deb/*.deb
            dist/*.tar.gz

  macos:
    name: Build macOS package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .dmg
        run: make package-dmg VERSION=${{ steps.version.outputs.version }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/dmg/*.dmg

  release:
    name: Publish GitHub Release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload every downloaded file; artifacts preserve their source
          # subdirectories (e.g. linux/deb/*.deb), so glob files recursively
          # rather than passing directories to gh.
          mapfile -t files < <(find artifacts -type f)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${files[@]}"
