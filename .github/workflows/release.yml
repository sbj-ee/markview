name: Release

# Build packages and publish a GitHub Release when a version tag is pushed.
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    name: Build Linux package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev fakeroot

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: make package-deb VERSION=${{ steps.version.outputs.version }}

      - name: Build binary tarball
        run: |
          VERSION=${{ steps.version.outputs.version }}
          go build -ldflags "-s -w -X main.version=${VERSION}" -o markview ./cmd/markview
          tar czf "dist/markview_${VERSION}_linux_amd64.tar.gz" markview README.md LICENSE.md

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/deb/*.deb
            dist/*.tar.gz

  macos:
    name: Build macOS package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .dmg
        run: make package-dmg VERSION=${{ steps.version.outputs.version }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/dmg/*.dmg

  release:
    name: Publish GitHub Release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # SHA256SUMS lists every release file and is signed with minisign by
      # the shared release key (DBC46B23C3AF0EF3, as zwriter and zedit).
      # Help > Check for Updates installs nothing without a valid signature.
      - name: Assemble and sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS && sha256sum -c SHA256SUMS)
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::Secret MINISIGN_SECRET_KEY is not set: refusing to publish an unsigned release"
            exit 1
          fi
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -S -s "$key" -m out/SHA256SUMS -t "markview $GITHUB_REF_NAME SHA256SUMS"
          rm -f "$key"
          # Verify with the public key compiled into this commit.
          pub=$(sed -n 's/^const SigningPublicKey = "\(RW[A-Za-z0-9+/=]*\)"/\1/p' internal/update/minisign.go)
          test -n "$pub"
          minisign -V -P "$pub" -m out/SHA256SUMS -x out/SHA256SUMS.minisig

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            out/*
